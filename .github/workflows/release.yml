# Release — Craft family standard.
#
# This is a thin caller: the real multi-platform pipeline (macOS universal DMG
# with notarization, Windows MSI with Azure Trusted Signing, Linux AppImage/deb/
# rpm/tar.gz, Flatpak, Arch, RISC-V, optional wasm, draft release + SHA256SUMS)
# lives in the shared workflow and is upgraded centrally.
#
# Trigger: push to the `release` branch, or a manual run with a version override.
#
# IMPORTANT: signing secrets are not configured in this repository yet. Pushing
# `release` today fails the macOS/Windows signing jobs on purpose rather than
# shipping unsigned builds. Configure the secrets in the `release` environment
# first (see docs/ROADMAP.md, X1).
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.1.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements
    # and security fixes propagate without PR churn across every craftapp repo.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      app-name: freerusch
      app-title: FreeRusch
      version: ${{ inputs.version }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
